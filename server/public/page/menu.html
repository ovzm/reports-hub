<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports Hub - Relatórios</title>
  <link rel="stylesheet" href="/css/menu.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="container">
    <nav class="navbar">
      <span class="brand-text light">Reports Hub</span>
      <div class="navbar-avatar">
        <div class="user-dropdown">
          <span id="userLabel" class="user-name">Usuário</span>
          <div class="dropdown-content">
            <button id="logoutBtn">Sair</button>
          </div>
        </div>
      </div>
    </nav>

    <div class="menu-actions">
      <a class="return-menu-btn" href="/page/home.html"><i class="fa fa-arrow-left"></i> Voltar ao menu</a>
    </div>

    <div class="search-container">
      <i class="fa fa-search"></i>
      <input id="searchInput" type="text" placeholder="Buscar relatório ou fundo...">
    </div>

    <div class="reports" id="reportsList"></div>
  </div>

  <script src="/js/session.js"></script>
  <script src="/js/menu.js"></script>
</body>
</html>
